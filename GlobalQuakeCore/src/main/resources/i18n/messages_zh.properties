# --- 设置：震源分析 ---
settings.hypocenter.title=高级
settings.minStations=发报所需最少测站数：{0}
settings.minStationsInfo=这里可以设置发出 EEW（紧急地震速报）所需检测到地震的最少测站数。\n增加该值可大幅减少误报，\n但可能导致测站较少的地区无法发出 EEW。
settings.maxStations=关联测站数量上限：{0}
settings.maxStationsInfo=这里可以设置震源定位算法使用的测站数量上限。\n增加该值可提高地震检测精度，\n但请注意，这样做也会显著增加计算负荷，可能导致处理时间变长。
settings.pWaveInaccuracy=P 波到达误差阈值：{0} 毫秒
settings.pWaveInaccuracyInfo=该值决定震源定位算法将当前点到测站的到时视为正确还是错误。\n较高的值限制较少，会导致更多误报。\n较低的值会迫使算法找到更精确的震源，但会导致更多漏报。
settings.correctnessThreshold=震源正确性阈值：{0} %
settings.correctnessThresholdInfo=该值决定震源何时被视为正确或错误。\n正确性按在误差阈值内到达的测站数占总测站数的百分比计算。\n如果震源被标记为不正确，地震将不会显示在地图上。\n较高的值会导致更多漏报，\n较低的值会导致更多误报。

