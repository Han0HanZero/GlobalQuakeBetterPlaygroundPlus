# 声音描述
sound.level_0.wav=检测到摇晃的簇被创建时触发。\n当 4 个或更多测站在近距离内检测到摇晃时触发。
sound.level_1.wav=簇达到等级 1 时触发。\n当至少 7 个测站达到 64 计数，或至少 4 个测站达到 1,000 计数时触发。
sound.level_2.wav=簇达到等级 2 时触发。\n当至少 7 个测站达到 1,000 计数，或至少 3 个测站达到 10,000 计数时触发。
sound.level_3.wav=簇达到等级 3 时触发。\n当至少 5 个测站达到 10,000 计数，或至少 3 个测站达到 50,000 计数时触发。
sound.level_4.wav=簇达到等级 4 时触发。\n当至少 4 个测站达到 50,000 计数时触发。\n此音频文件默认为空白，因为该警报音尚未添加！
sound.intensify.wav=满足上一个警报选项卡中指定的条件时触发。
sound.felt.wav=如果您的家庭位置预计会发生摇晃时触发。\n阈值烈度标准和等级可在警报选项卡中配置。
sound.felt_strong.wav=如果您的家庭位置预计会发生强烈摇晃时触发。\n阈值烈度标准和等级可在警报选项卡中配置。\n此音频文件默认为空白，因为该警报音尚未添加！
sound.eew_warning.wav=当检测到地震且陆地预估烈度至少为 MMI VI 时触发。\n此音频文件默认为空白，因为该警报音尚未添加！
sound.countdown.wav=S 波到达您的家庭位置前最后 10 秒的倒计时（如果预计那里会发生摇晃）。
sound.update.wav=地震参数已更新（修订）。
