# Sound descriptions
sound.level_0.wav=Triggered once so-called Cluster is created. \nThis happens if 4 or more stations detect shaking in close proximity.
sound.level_1.wav=Triggered when cluster reaches level 1. \nThis happens when at least 7 stations reach 64 counts or at least 4 stations reach 1,000 counts.
sound.level_2.wav=Triggered when cluster reaches level 2. \nThis happens when at least 7 stations reach 1,000 counts or at least 3 stations reach 10,000 counts.
sound.level_3.wav=Triggered when cluster reaches level 3. \nThis happens when at least 5 stations reach 10,000 counts or at least 3 stations reach 50,000 counts.
sound.level_4.wav=Triggered when cluster reaches level 4. \nThis happens when at least 4 stations reach 50,000 counts. \nThis audio file is BLANK at default since this alarm sound has not yet been added!
sound.intensify.wav=Triggered if the conditions specified in the previous Alerts settings tab are met.
sound.felt.wav=Triggered if shaking is expected at your home location. \nThe threshold intensity scale and level can be configured in the Alerts tab.
sound.felt_strong.wav=Triggered if STRONG shaking is expected at your home location. \nThe threshold intensity scale and level can be configured in the Alerts tab. \nThis audio file is BLANK at default since this alarm sound has not yet been added!
sound.eew_warning.wav=Triggered if there is high certainty in the detected earthquake and \nit has at least MMI VI estimated intensity on land. \nThis audio file is BLANK at default since this alarm sound has not yet been added!
sound.countdown.wav=Countdown of the last 10 seconds before S waves arrives at your home location\nif shaking is expected there.
sound.update.wav=Earthquake parameters updated (revision).
sound.found.wav=Earthquake epicenter determined for the first time and it appears on the map.
