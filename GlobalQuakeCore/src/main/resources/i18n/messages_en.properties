# --- Settings: Hypocenter Analysis ---
settings.hypocenter.title=Advanced
settings.minStations=Minimum number of stations: {0}
settings.minStationsInfo=Here you can set the minimum number of stations that need to pick up the earthquake for the EEW to be issued.\nIncreasing the number can greatly reduce the number of false alarms,\nbut may also cause EEW's to not appear in areas with less stations.
settings.maxStations=Maximum number of associated stations: {0}
settings.maxStationsInfo=Here you can set the maximum number of stations that will be used for the hypocenter finding algorithm.\nIncreasing this value can enhance the accuracy of earthquake detection,\nhowever, it's important to note that doing so will also significantly escalate the computational demands, potentially leading to longer processing times.
settings.pWaveInaccuracy=P Wave Arrival Inaccuracy Threshold: {0} ms
settings.pWaveInaccuracyInfo=This value determines the threshold value when the hypocenter finding algorithm considers the arrival from current point to a station correct or incorrect.\nHigher values are less restrictive and will lead to more false positives.\nLower values will force the algorithm to find more accurate hypocenter and will lead to more false negatives.
settings.correctnessThreshold=Hypocenter Correctness Threshold: {0} %
settings.correctnessThresholdInfo=This value determines the threshold when a hypocenter is considered correct or not.\nThe correctness is calculated as the % of stations that have arrival within the Inaccuracy threshold and total number of stations used by the hypocenter locating algoritgm.\nIf hypocenter is marked as incorrect, the earthquake will not be displayed on the map.\nHigher values will lead to more false negatives,\nLower values will lead to more false positives.

